name: Verify exact private WhatsApp PR on Xcode 27

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Optional isolated Simulator acceptance tests'
        required: true
        type: choice
        default: none
        options: [none, native-acceptance]
      request_id:
        description: "Opaque 32-character request ID, no private SHA"
        required: true
        type: string

run-name: Exact PR iOS build ${{ inputs.request_id }}

permissions:
  contents: read

jobs:
  exact-private-pr-ios:
    if: github.actor == 'MMatlacz' || github.actor == 'mmat-wa-public-dispatch[bot]'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Validate opaque request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[a-f0-9]{32}$ ]] || exit 2

      - name: Checkout public CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lab
          persist-credentials: false

      - name: Verify public file boundary
        working-directory: lab
        run: bash scripts/verify-public-boundary.sh

      - name: Require configured source App
        env:
          APP_ID: ${{ secrets.WHATSAPP_SOURCE_APP_ID }}
          APP_KEY: ${{ secrets.WHATSAPP_SOURCE_APP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$APP_ID" && -n "$APP_KEY" ]] || {
            echo "Private source App is not configured; no checkout performed."
            exit 2
          }

      - name: Mint restricted private source token
        id: private-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.WHATSAPP_SOURCE_APP_ID }}
          private-key: ${{ secrets.WHATSAPP_SOURCE_APP_KEY }}
          owner: MMatlacz
          repositories: Whatsapp
          permission-contents: read

      - name: Checkout actual private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MMatlacz/Whatsapp
          # Private request-scoped ref exists only after trusted Nimbus admission.
          ref: refs/tags/ci-pr-${{ inputs.request_id }}
          token: ${{ steps.private-token.outputs.token }}
          path: private-src
          persist-credentials: false

      - name: Verify private ref resolves to checked-out HEAD
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          cd private-src
          # SHA stays out of public workflow inputs; do not echo it.
          git rev-parse --verify HEAD >/dev/null
          git cat-file -e HEAD^{commit}
          # Checkout fetched only the requested ref; do not require another token.
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/ci-pr-${REQUEST_ID}^{commit}")"

      - name: Compile actual private iOS app and diagnostic targets
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cd private-src
          test -f native-ios/WhatsAppTranslator.xcodeproj/project.pbxproj
          test -f native-ios/ci/swiftpm-plugins.json
          test -f native-ios/ci/swiftpm-macros.json
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          npm --prefix native-ios/BridgeRuntime ci --ignore-scripts --no-audit --no-fund --no-progress
          npm --prefix native-ios/BridgeRuntime run bundle
          xcodebuild -downloadComponent MetalToolchain
          security_dir="$HOME/Library/org.swift.swiftpm/security"
          mkdir -p "$security_dir"
          install -m 600 native-ios/ci/swiftpm-plugins.json "$security_dir/plugins.json"
          install -m 600 native-ios/ci/swiftpm-macros.json "$security_dir/macros.json"
          xcodebuild -quiet -project native-ios/WhatsAppTranslator.xcodeproj \
            -scheme WhatsAppTranslator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/whatsapp-derived-data" \
            INDEX_STORE_PATH="$RUNNER_TEMP/whatsapp-index" CODE_SIGNING_ALLOWED=NO clean build
          cd native-ios/QwenMLXDiagnosticAdapter
          swift package resolve
          swift test
          swift build --product qwen-mlx-benchmark
          swift run qwen-mlx-benchmark --help
          xcodebuild -quiet -scheme QwenMLXDiagnosticAdapter -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/whatsapp-mlx-derived-data" \
            CODE_SIGNING_ALLOWED=NO build
          cd ../..
          xcodebuild -quiet -project native-ios/QwenDeviceBenchmarkHarness.xcodeproj \
            -scheme QwenDeviceBenchmarkHarness -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/qwen-device-benchmark-derived-data" \
            INDEX_STORE_PATH="$RUNNER_TEMP/qwen-device-benchmark-index" \
            CODE_SIGNING_ALLOWED=NO clean build
          echo 'Full actual private application and diagnostic Simulator targets built.'

      - name: Execute isolated native Apple acceptance suite
        if: inputs.test_suite == 'native-acceptance'
        shell: bash
        env:
          PRIVATE_ROOT: ${{ github.workspace }}/private-src
          REQUEST_ID: ${{ inputs.request_id }}
        run: bash lab/scripts/run-native-acceptance.sh
