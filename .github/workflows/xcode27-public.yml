name: Public Synthetic Swift and Xcode 27 CI
# This title contains ONLY an opaque random ID; never a private repo, PR or SHA.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Public synthetic lab {0}', inputs.request_id) || format('Public synthetic lab {0}', github.sha) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque public correlation ID (lab- followed by 32 lowercase hex)
        required: true
        type: string
      suite:
        description: Exact public synthetic test suite identifier
        required: true
        type: choice
        options: [synthetic-xcode27-v1]

permissions:
  contents: read

concurrency:
  # Each request must have its OWN group; never cancel a different probe.
  group: ci-lab-${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.ref }}
  cancel-in-progress: true

jobs:
  linux-synthetic:
    name: linux-arm64-synthetic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout public synthetic lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify public contents
        run: bash scripts/verify-public-boundary.sh
      - name: Test dispatch-input validation
        run: bash scripts/test-dispatch-inputs.sh
      - name: Validate opaque dispatch (no private data)
        if: github.event_name == 'workflow_dispatch'
        env:
          LAB_REQUEST_ID: ${{ inputs.request_id }}
          LAB_SUITE: ${{ inputs.suite }}
        run: bash scripts/validate-dispatch-inputs.sh
      - name: Run Swift package tests
        run: swift test --parallel

  xcode27-synthetic:
    name: xcode27-synthetic
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout public synthetic lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify public contents
        run: bash scripts/verify-public-boundary.sh
      - name: Test dispatch-input validation
        run: bash scripts/test-dispatch-inputs.sh
      - name: Validate opaque dispatch (no private data)
        if: github.event_name == 'workflow_dispatch'
        env:
          LAB_REQUEST_ID: ${{ inputs.request_id }}
          LAB_SUITE: ${{ inputs.suite }}
        run: bash scripts/validate-dispatch-inputs.sh
      - name: Verify Apple Silicon runner and Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "$(uname -m)" = "arm64"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Run synthetic Swift package tests with Xcode
        run: swift test --parallel
      - name: Compile synthetic library for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          # A standalone SwiftPM package is exposed by Xcode under its
          # PACKAGE name, not necessarily the library product name.
          xcodebuild -list
          xcodebuild -scheme SyntheticXcodeCILab \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ci-lab-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
