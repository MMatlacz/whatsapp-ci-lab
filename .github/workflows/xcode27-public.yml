name: Public Synthetic Swift and Xcode 27 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Opaque random hexadecimal ID; never a private commit SHA'
        required: true
        type: string
      scenario:
        description: 'Synthetic test mode'
        required: true
        type: choice
        default: pass
        options: [pass, fail-canary]

# Public workflow metadata must never include private SHA, PR, source path or actor.
run-name: Synthetic lab ${{ inputs.request_id || github.event_name }}

permissions:
  contents: read

concurrency:
  group: ci-lab-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-dispatch:
    name: validate-opaque-request
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - name: Reject malformed or unsupported public workflow input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo 'Invalid opaque request ID (exactly 32 lowercase hex digits required).'
            exit 2
          fi
          case "$SCENARIO" in
            pass|fail-canary) ;;
            *) echo 'Unsupported synthetic test scenario.'; exit 2 ;;
          esac
          echo 'Synthetic request contract: PASS'

  failure-canary:
    name: synthetic-failure-canary
    if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'fail-canary'
    needs: validate-dispatch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - name: Intentionally fail a synthetic diagnostic
        shell: bash
        run: |
          echo 'Public synthetic failure canary (no private code).'
          exit 42

  linux-synthetic:
    needs: validate-dispatch
    if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'pass'
    name: linux-arm64-synthetic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout public synthetic lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify public contents
        run: bash scripts/verify-public-boundary.sh
      - name: Run Swift package tests
        run: swift test --parallel

  xcode27-synthetic:
    name: xcode27-synthetic
    needs: validate-dispatch
    if: github.event_name != 'workflow_dispatch' || inputs.scenario == 'pass'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout public synthetic lab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify public contents
        run: bash scripts/verify-public-boundary.sh
      - name: Verify Apple Silicon runner and Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "$(uname -m)" = "arm64"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Run synthetic Swift package tests with Xcode
        run: swift test --parallel
      - name: Compile synthetic library for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          # A standalone SwiftPM package is exposed by Xcode under its
          # PACKAGE name, not necessarily the library product name.
          xcodebuild -list
          xcodebuild -scheme SyntheticXcodeCILab \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ci-lab-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
